[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-data"
version = "0.1.0"
description = "Data engineering project for analyzing access to healthcare services."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pandas",
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]