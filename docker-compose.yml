services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: data-health-mcd-unison:dev
    container_name: data-health-app

    ports:
      - "8501:8501"

    volumes:
      - .:/project

    working_dir: /project

    environment:
      PYTHONPATH: /project/src
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HEALTH_AUTO_PREPARE: ${HEALTH_AUTO_PREPARE:-1}
      SAKBE_TOKENS: ${SAKBE_TOKENS:-}
      SAKBE_TOKEN: ${SAKBE_TOKEN:-}
      CARTO_API_KEY: ${CARTO_API_KEY:-}
